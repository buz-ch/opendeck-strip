# opendeck-strip configuration: ~/.config/opendeck-strip/config.toml
#
# Every key is optional; a missing key keeps its default. A value this file
# cannot use is reported by `opendeck-strip doctor` and in the log, and that
# key keeps its default. Environment overrides: OPENDECK_STRIP_<KEY>
# (e.g. OPENDECK_STRIP_ZJSE_MODE=compact). Booleans: 1/true/yes/on and
# 0/false/no/off, in any case. The status file's strip_mode and strip_gap
# take precedence over this file.

# ---- the Zellij deck -------------------------------------------------------

# Run `opendeck-strip follow-zellij`; `doctor` then checks for a live Zellij session.
follow = true

# "strip": the four-segment touch strip. "compact": one dial or key.
zjse_mode = "strip"
# "segments": counts plus entries across the strip. "lines": one full-width
# segment, one row per entry, the counts template as the left gutter. Needs
# strip mode; tabs in the strip value then make columns (raw or continuous).
# zjse_layout = "segments"
# zjse_slot = "dial1"        # compact only: dial1..dial4 or key<row>_<col>

# Nothing active: false keeps the counts panel plus "All clear"; true clears
# the owned slots instead.
zjse_blank_when_idle = false

# Minimum time between two writes; the latest state wins.
zjse_min_interval_ms = 1000

# ---- templates -------------------------------------------------------------
# Empty lines in a template are ignored. {age} is computed when a document
# arrives and is not refreshed until the next one. With zjse_layout = "lines"
# each line is one cell of a row: the counts lines form the gutter, the entry
# lines the entry cells, and the more lines the +N more row.
# Fields: app, title, state, state_label, kind, msg, progress_pct, tasks,
# marker, color, count, tab, pane, age, session, tab_name, plus the count
# fields (needs_you, failed, done, working, total and the four *_color).

zjse_entry_template = """
[b]{app|title:14}[/b]
[c={color}]{state_label}[/c]
{progress_pct|msg:22}"""

zjse_counts_template = """
[c={needs_you_color}]● {needs_you}[/c]
[c={failed_color}]✗ {failed}[/c]
[c={done_color}]✓ {done}[/c]
[c={working_color}]» {working}[/c]"""

zjse_more_template = """
[b]+{hidden} more[/b]
[c={color}]{state_label}[/c]
see inbox"""

# Compact mode only.
# zjse_compact_template = """
# [c={color}]{marker} {count}[/c]
# {app|title:8}"""

# Empty: the counts panel plus the default "All clear" in strip mode, and
# nothing in compact mode.
zjse_idle_template = ""

# Compact alternative: one dial or key instead of the strip.
# zjse_mode = "compact"
# zjse_slot = "dial2"
# zjse_compact_template = """
# [c={color}]{marker} {count}[/c]
# {app|title:10}
# {state_label}"""

# ---- writer ----------------------------------------------------------------

# The renderer sets strip_mode = "raw" itself when it first writes a strip.
# strip_mode = "raw"

# Tile gap in pixels, 0 to 32.
# strip_gap = 28

# Gap between tab columns in a full-width strip grid, 0 to 16.
# column_gap = 2

# Give all auto-sized strip segments the same font size; optionally leave the
# counts panel (segment 1) out of the shared size.
# strip_uniform_size = true
# strip_uniform_skip_first = true

# Size budget for the final device JPEG; lower it if the strip corrupts.
# max_jpeg_bytes = 9000

# ---- fonts and colours -----------------------------------------------------

# The binary embeds Source Sans 3 and Source Code Pro, all four faces each.
# font_sans = "/path/to/SourceSans3-Regular.ttf"
# default_color = "#ffffff"
# default_bg = "#000000"
# padding_horizontal = 4.0     # left and right inner padding in pixels
# padding_vertical = 4.0       # top and bottom inner padding in pixels
# bar_color = "#55ccff"
# bar_bg = "#202830"
