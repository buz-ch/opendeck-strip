[[example]]
name = "compact-custom"
scenario = "agents"
zjse_mode = "compact"
zjse_slot = "dial1"
zjse_compact_template = "{marker} {count} [c=grey]{age}[/c]\n[b]{app|title:10}[/b]\n{state_label}"

[[example]]
name = "compact-ratio"
scenario = "mixed"
zjse_mode = "compact"
zjse_slot = "dial1"
zjse_compact_template = "[s=1.8][c={color}]{needs_you}/{total}[/c][/s]\n{state_label}"

[[example]]
name = "compact-message"
scenario = "agents"
zjse_mode = "compact"
zjse_slot = "dial1"
zjse_compact_template = "[c={color}]{marker}[/c] [b]{app|title:8}[/b]\n{msg:14}"

[[example]]
name = "compact-idle"
scenario = "idle"
zjse_mode = "compact"
zjse_slot = "dial1"
zjse_idle_template = "[c=grey]quiet[/c]"
