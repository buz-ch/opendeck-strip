# The 29 preview examples: which document scenario and which renderer keys.
# Used by tests/zjse_golden.rs and preview.sh.
#
# `scenario` names a document in scenarios/<name>.json. Every other key is a
# renderer key (§4.3 of zj-strip-bridge-data-only-spec.md); missing keys take
# their default. `\n` in a basic string is a real newline, which the template
# parser accepts like a literal `\n`.

# ---- Default templates: the strip ----
[[example]]
name = "default-mixed"
scenario = "mixed"

[[example]]
name = "default-agents"
scenario = "agents"

[[example]]
name = "default-busy"
scenario = "busy"

[[example]]
name = "default-one-blocked"
scenario = "one-blocked"

[[example]]
name = "default-tasks"
scenario = "tasks"

[[example]]
name = "default-idle"
scenario = "idle"

[[example]]
name = "safe-text"
scenario = "hostile"

# ---- Default templates: one slot (compact) ----
[[example]]
name = "default-compact-mixed"
scenario = "mixed"
zjse_mode = "compact"
zjse_slot = "dial1"

[[example]]
name = "default-compact-agents"
scenario = "agents"
zjse_mode = "compact"
zjse_slot = "dial1"

[[example]]
name = "default-compact-busy"
scenario = "busy"
zjse_mode = "compact"
zjse_slot = "dial1"

[[example]]
name = "default-compact-one-blocked"
scenario = "one-blocked"
zjse_mode = "compact"
zjse_slot = "dial1"

[[example]]
name = "default-compact-tasks"
scenario = "tasks"
zjse_mode = "compact"
zjse_slot = "dial1"

[[example]]
name = "default-compact-idle"
scenario = "idle"
zjse_mode = "compact"
zjse_slot = "dial1"

# ---- Custom templates: the strip ----
[[example]]
name = "idle-text"
scenario = "idle"
zjse_idle_template = "[c=grey]all quiet[/c]\n{total} active"

[[example]]
name = "tasks"
scenario = "tasks"
zjse_entry_template = "[b]{app|title:14}[/b]\n[c={color}]{state_label}[/c]\n{tasks|progress_pct|msg:22}"

[[example]]
name = "age"
scenario = "agents"
zjse_entry_template = "[b]{app|title:14}[/b] [c=grey]{age}[/c]\n[c={color}]{state_label}[/c]\n{msg:22}"

[[example]]
name = "custom-layout"
scenario = "mixed"
zjse_counts_template = "[b]{total}[/b] active\n[c={needs_you_color}]{needs_you} need you[/c]\n[c={failed_color}]{failed} failed[/c]"
zjse_entry_template = "{marker} [b]{app|title:12}[/b]\n[c={color}]{state_label}[/c]\n[c=grey]{msg:24}[/c]"

[[example]]
name = "message-first"
scenario = "agents"
zjse_entry_template = "{msg:20}\n[c={color}]{state_label}[/c]\n[c=grey]{app|title}[/c]"

[[example]]
name = "big-marker"
scenario = "mixed"
zjse_entry_template = "[s=2.4][c={color}]{marker}[/c][/s]\n[b]{app|title:12}[/b]"
zjse_counts_template = "[s=1.6][c={needs_you_color}]● {needs_you}[/c][/s]\n[s=1.6][c={failed_color}]✗ {failed}[/c][/s]"

[[example]]
name = "progress"
scenario = "agents"
zjse_entry_template = "[b]{app|title:14}[/b]\n[c={color}]{progress_pct|state_label}[/c]\n[c=grey]{msg:22}[/c]"

[[example]]
name = "kind"
scenario = "mixed"
zjse_entry_template = "[b]{app|title:14}[/b]\n[c={color}]{state}[/c] [c=grey]{kind}[/c]\n{msg:22}"

[[example]]
name = "where"
scenario = "mixed"
zjse_entry_template = "[b]{app|title:12}[/b]\n[c={color}]{state_label}[/c]\n[c=grey]tab {tab} pane {pane} {age}[/c]"

[[example]]
name = "more-segment"
scenario = "busy"
zjse_more_template = "[s=1.6][c={color}]{marker}[/c][/s] [b]+{hidden}[/b]\n[c={color}]{state_label}[/c]"

# ---- The lines layout ----
[[example]]
name = "lines-agents"
scenario = "agents"
zjse_layout = "lines"

[[example]]
name = "lines-busy"
scenario = "busy"
zjse_layout = "lines"

