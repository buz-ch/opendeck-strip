[package]
name = "opendeck-strip"
version = "0.1.0"
edition = "2024"
rust-version = "1.89"
description = "Status text on the keys, dials and touch strip of a Mirabox N4E through OpenDeck"
license = "MIT"
publish = false

[dependencies]
ab_glyph = "0.2"
anyhow = "1"
base64 = "0.22"
clap = { version = "4", features = ["derive"] }
env_logger = "0.11"
image = { version = "0.25", default-features = false, features = ["jpeg", "png"] }
log = "0.4"
notify = "8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
signal-hook = "0.3"
tempfile = "3"
toml = "0.9"
tungstenite = "0.28"

[dev-dependencies]
image = { version = "0.25", default-features = false, features = ["jpeg", "png"] }
tungstenite = "0.28"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[profile.release]
lto = "thin"
strip = true
